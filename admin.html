<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR SHOP — Administration</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">FR</span><span>FR SHOP ADMIN</span></a><a class="primary" href="index.html">Voir la boutique</a></div></header><main class="container" style="padding:35px 0 60px"><div id="login"><div class="modal-card" style="margin:auto"><h2>Administration</h2><p class="muted">Entrez votre mot de passe administrateur.</p><form id="loginForm"><input id="adminPass" type="password" placeholder="Mot de passe" required><button class="primary" type="submit">Connexion</button></form></div></div><div id="panel" class="hidden"><div class="section-head"><div><h1>Tableau de bord</h1><p>Gérez produits, paiements et commandes.</p></div><button class="primary" id="logout">Déconnexion</button></div><div class="admin-grid"><section class="admin-card"><h2>Ajouter / modifier un produit</h2><form id="productForm"><input type="hidden" id="pid"><input id="pname" placeholder="Nom du produit" required><div class="two"><input id="pcat" placeholder="Catégorie" required><input id="pprice" type="number" min="0" step="0.01" placeholder="Prix USDT" required></div><input id="pimages" placeholder="URLs des images, séparées par une virgule"><input id="purl" placeholder="Lien Binance du produit"><label><input type="checkbox" id="pfeatured"> Produit mis en avant</label><button class="primary" type="submit">Enregistrer le produit</button></form></section><section class="admin-card"><h2>Moyens de paiement crypto</h2><form id="payForm"><input id="payName" placeholder="Nom (ex. USDT BEP20)" required><input id="payNetwork" placeholder="Réseau (ex. BEP20)"><input id="payUrl" placeholder="Lien Binance / paiement / wallet" required><label><input type="checkbox" id="payEnabled" checked> Activé</label><button class="primary" type="submit">Ajouter le paiement</button></form><div id="payList"></div></section></div><section class="admin-card" style="margin-top:20px"><h2>Produits</h2><div id="adminProducts"></div></section><section class="admin-card" style="margin-top:20px"><h2>Commandes</h2><div id="orders"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
