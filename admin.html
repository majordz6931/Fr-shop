<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FR SHOP Admin</title><link rel="stylesheet" href="admin.css"></head><body><div id="loginView" class="login"><div class="loginbox"><a class="logo" href="index.html">FR <b>SHOP</b></a><h1>Administration</h1><p>Gestion sécurisée de la boutique.</p><form id="loginForm"><input id="adminEmail" type="email" value="manseurange@gmail.com" required><input id="adminPass" type="password" placeholder="Mot de passe" required><button>Se connecter</button><small id="loginStatus"></small></form></div></div><div id="appView" hidden><header><a class="logo" href="index.html">FR <b>SHOP</b></a><nav><button class="tab active" data-section="overview">Vue générale</button><button class="tab" data-section="products">Produits</button><button class="tab" data-section="payments">Paiements</button><button class="tab" data-section="orders">Commandes</button></nav><div><a href="index.html">Boutique</a><button id="logout">Déconnexion</button></div></header><main><section id="overview" class="view"><div class="hero"><small>COMMAND CENTER</small><h1>FR SHOP<br><span>Control.</span></h1></div><div class="stats"><div><small>Produits</small><b id="statProducts">0</b></div><div><small>Paiements actifs</small><b id="statPayments">0</b></div><div><small>Commandes</small><b id="statOrders">0</b></div><div><small>CA</small><b id="statRevenue">0 USDT</b></div></div><div class="panel"><h2>Dernières commandes</h2><div id="recentOrders"></div></div></section><section id="products" class="view" hidden><div class="toolbar"><h1>Produits</h1><button id="newProduct">+ Ajouter</button></div><div class="panel" id="productGrid"></div></section><section id="payments" class="view" hidden><div class="toolbar"><h1>Paiements</h1><button id="newPayment">+ Ajouter</button></div><div id="paymentGrid"></div></section><section id="orders" class="view" hidden><div class="toolbar"><h1>Commandes</h1><input id="orderSearch" placeholder="Rechercher"></div><div class="panel" id="ordersTable"></div></section></main></div><div id="productModal" class="modal"><div class="box"><button class="x" data-close>×</button><h2>Produit</h2><form id="productForm"><input id="pid" type="hidden"><input id="pname" placeholder="Nom" required><input id="pcat" placeholder="Catégorie" required><input id="pprice" type="number" step=".01" placeholder="Prix USDT" required><input id="purl" placeholder="Lien Binance Pay"><label><input id="pfeatured" type="checkbox"> Vedette</label><input id="pimagesFile" type="file" accept="image/png,image/jpeg,image/webp" multiple><div id="imagePreview"></div><button>Enregistrer</button></form></div></div><div id="paymentModal" class="modal"><div class="box"><button class="x" data-close>×</button><h2>Moyen de paiement</h2><form id="paymentForm"><input id="payId" type="hidden"><input id="payName" placeholder="Nom" required><input id="payNetwork" placeholder="Réseau" required><input id="payWallet" placeholder="Wallet"><input id="payQr" placeholder="URL QR"><input id="payUrl" placeholder="URL paiement"><label><input id="payEnabled" type="checkbox" checked> Actif</label><button>Enregistrer</button></form></div></div><div id="orderModal" class="modal"><div class="box"><button class="x" data-close>×</button><h2>Commande</h2><div id="orderDetails"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
